<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<style>
@font-face{font-family:'Anton';src:url(Anton-Regular.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07050f}
body{font-family:'Manrope',system-ui,sans-serif;color:#fff;position:relative}
.hero{position:absolute;left:-60px;top:-250px;width:1200px;height:2133px;background:url(hero.png) center/cover no-repeat;filter:saturate(1.08) contrast(1.05)}
.shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(7,5,15,.85) 0%,rgba(7,5,15,.25) 13%,rgba(7,5,15,0) 26%,rgba(7,5,15,0) 44%,rgba(7,5,15,.72) 58%,#07050f 70%),
  radial-gradient(700px 520px at 50% 33%,rgba(203,251,97,.20),transparent 70%)}
.logo{position:absolute;left:58px;top:150px;width:168px;filter:drop-shadow(0 8px 26px rgba(0,0,0,.55))}
.pill{position:absolute;right:58px;top:172px;display:inline-flex;align-items:center;gap:12px;height:62px;padding:0 28px;border-radius:999px;background:#cbfb61;color:#14110b;font:800 26px/1 'Manrope';letter-spacing:.14em;box-shadow:0 0 40px rgba(203,251,97,.45)}
.pill i{width:14px;height:14px;border-radius:50%;background:#14110b;display:inline-block}
.txt{position:absolute;left:64px;right:64px;top:1105px}
.kick{font:800 30px/1 'Manrope';letter-spacing:.2em;color:#cbfb61}
.h1{margin-top:20px;font:400 168px/.92 'Anton';letter-spacing:.005em;color:#fff;text-transform:uppercase}
.h1 .lime{color:#cbfb61;text-shadow:0 0 60px rgba(203,251,97,.45)}
.sub{margin-top:30px;font:800 54px/1.15 'Manrope';color:#fff}
.chips{margin-top:34px;display:flex;flex-wrap:wrap;gap:16px}
.chips span{display:inline-flex;align-items:center;gap:12px;height:66px;padding:0 26px;border-radius:20px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(203,251,97,.55);font:800 30px/1 'Manrope'}
.chips b{color:#cbfb61}
</style></head><body>
<div class="hero"></div><div class="shade"></div>
<img class="logo" src="logo.webp" alt="JetUP">
<div class="pill"><i></i>WATCH · 10 SEC</div>
<div class="txt">
 <div class="kick">THE BIX CARD</div>
 <div class="h1">Spend your<br><span class="lime">crypto.</span></div>
 <div class="sub">A Visa card. Your keys stay yours.</div>
 <div class="chips"><span><b>✓</b>Self-custody</span><span><b>✓</b>Apple Pay &amp; Google Pay</span></div>
</div>
</body></html>
