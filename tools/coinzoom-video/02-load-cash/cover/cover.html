<!doctype html><html><head><meta charset="utf-8">
<!-- Cover of MTG's narrated CoinZoom video "How to Load Cash into your CoinZoom Account" (16:9, also the
     poster and thumbnail). The series look of MTG's explainers. The phone shows the clip's own store map
     (screen.jpg: source frame 388, screen only, x2; nothing private on it). Never MTG's photo: the CoinZoom logo disc.
     Shoot it with shoot.js. -->
<style>
@font-face{font-family:'Anton';src:url(Anton-Regular.ttf)}
@font-face{font-family:'Manrope';font-weight:800;src:url(Manrope-ExtraBold.ttf)}
@font-face{font-family:'Manrope';font-weight:700;src:url(Manrope-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#fff;position:relative;background:
 radial-gradient(900px 650px at 76% 42%,rgba(140,108,231,.42),transparent 70%),radial-gradient(760px 560px at 74% 70%,rgba(203,251,97,.13),transparent 70%),
 radial-gradient(800px 600px at 8% 95%,rgba(232,194,90,.22),transparent 70%),linear-gradient(160deg,#150d2c,#0b0912 55%,#07050f)}
.grid{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:80px 80px}
.em{font-style:normal;font-family:'Noto Color Emoji'}
.pill{position:absolute;left:96px;top:96px;display:inline-flex;align-items:center;height:64px;padding:0 30px;border-radius:999px;background:#cbfb61;color:#14110b;font:800 28px/1 'Manrope';letter-spacing:.16em;z-index:5}
.h{position:absolute;left:92px;top:200px;font:400 150px/.95 'Anton';text-transform:uppercase;white-space:nowrap;z-index:5}
.h .g{background:linear-gradient(180deg,#fff3c4,#f3d27a 38%,#c99a2e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{position:absolute;left:96px;top:520px;font:800 48px/1.25 'Manrope';color:#e9e3ff;white-space:nowrap;z-index:5}
.sub b{color:#cbfb61}
.chips{position:absolute;left:96px;top:640px;display:flex;flex-direction:column;align-items:flex-start;gap:16px;z-index:5}
.chips span{display:inline-flex;align-items:center;gap:14px;height:76px;padding:0 28px;border-radius:22px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(203,251,97,.5);font:800 34px/1 'Manrope';white-space:nowrap}
.chips b{color:#cbfb61}
.disc{position:absolute;left:1650px;top:96px;width:200px;height:200px;border-radius:50%;padding:7px;background:conic-gradient(from 210deg,#fff1b8,#c99a2e,#f7dd8d,#9c6f1f,#fff1b8);box-shadow:0 0 90px rgba(232,194,90,.45),0 30px 70px rgba(0,0,0,.55);z-index:6}
.disc img{width:100%;height:100%;border-radius:50%;display:block}
.brand{position:absolute;right:100px;bottom:72px;font:800 30px/1 'Manrope';letter-spacing:.16em;color:#e8c25a;white-space:nowrap;z-index:5}
.brand .sep{display:inline-block;width:3px;height:28px;margin:0 .5em 0 .32em;vertical-align:-4px;border-radius:2px;background:rgba(232,194,90,.75)}
/* the slim premium phone: thin gold-titanium rim, thin black bezel, camera island, small side buttons */
#ph{position:absolute;left:1190px;top:112px;width:360px;height:752px;border-radius:62px;padding:12px;background:#050409;z-index:4;transform:rotate(6deg);
 box-shadow:0 0 0 3px #c9a45e,0 0 0 4.5px rgba(255,236,186,.55),0 0 0 6px #6d5428,0 50px 110px rgba(0,0,0,.65),0 0 120px rgba(203,251,97,.18)}
#ph .scr{width:100%;height:100%;border-radius:51px;overflow:hidden;position:relative;background:#f2f1f7}
#ph .scr img{position:absolute;left:0;top:-4px;width:336px;height:726px}
#ph .isl{position:absolute;left:50%;top:22px;width:104px;height:30px;margin-left:-52px;border-radius:20px;background:#050409;z-index:2}
#ph .btn{position:absolute;width:5px;border-radius:3px;background:linear-gradient(90deg,#8a6a2c,#e9cf8e)}
#ph .b1{left:-8px;top:170px;height:54px}#ph .b2{left:-8px;top:240px;height:54px}#ph .b3{right:-8px;top:210px;height:90px}
/* the video's success chip */
.ok{position:absolute;left:1000px;top:700px;display:inline-flex;align-items:center;gap:14px;height:84px;padding:0 30px;border-radius:999px;z-index:6;white-space:nowrap;
 background:rgba(21,17,42,.96);box-shadow:inset 0 0 0 3px rgba(203,251,97,.9),0 0 40px rgba(203,251,97,.35),0 24px 50px rgba(0,0,0,.55);font:800 36px/1 'Manrope'}
.tap{position:absolute;left:1590px;top:440px;display:inline-flex;align-items:center;gap:12px;height:70px;padding:0 26px;border-radius:999px;z-index:6;white-space:nowrap;
 background:rgba(21,17,42,.96);box-shadow:inset 0 0 0 2.5px rgba(255,224,143,.9),0 0 34px rgba(232,194,90,.35),0 24px 50px rgba(0,0,0,.55);font:800 30px/1 'Manrope'}
.tap b{color:#ffe08f}
</style></head><body><div class="grid"></div>
<div class="pill" id="pill">COINZOOM · 1:58</div>
<div class="h">Load cash<br><span class="g">into CoinZoom</span></div>
<div class="sub">Pay cash at a store near you, <b>in 4 steps.</b></div>
<div class="chips"><span><i class="em">🏦</i>Deposit <b>›</b> CoinZoom Cash <b>›</b> Map <b>›</b> Barcode</span><span><i class="em">🏪</i>Speedway, Stripes, 7-Eleven</span></div>
<div class="disc"><img src="coinzoom-disc.png" alt=""></div>
<div id="ph"><span class="btn b1"></span><span class="btn b2"></span><span class="btn b3"></span><span class="isl"></span><div class="scr"><img src="screen.jpg" alt="CoinZoom Cash store map"></div></div>
<div class="ok"><i class="em">🧾</i>Cashier scans. Done!</div>
<div class="tap"><i class="em">📍</i><b>Pick a store</b></div>
<div class="brand">MTG <i class="em">👑</i><span class="sep"></span>YOUR DIGITAL ARCHITECT</div>
</body></html>
