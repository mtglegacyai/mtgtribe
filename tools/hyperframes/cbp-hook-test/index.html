      for (let i = 0; i < 20; i++) {
        const el = document.getElementById("d" + i);
        const dx = 540 - 38 - parseFloat(el.style.left), dy = 975 - 38 - parseFloat(el.style.top);
        const t = 6.7 + i * 0.085;
        tl.fromTo(el, { x: 0, y: 0, opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t);
        tl.to(el, { x: dx, y: dy, duration: 0.55, ease: "power2.in" }, t);
        tl.to(el, { opacity: 0, scale: 0.4, duration: 0.08, ease: "none" }, t + 0.55);
      }

      tl.fromTo("#s3-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 7.6);
      tl.to("#s3-in", { opacity: 0, duration: 0.3, ease: "power2.in" }, 9.15);
