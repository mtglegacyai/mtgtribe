<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>MTG TRIBE Invite (horizontal)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@500;700&family=Great+Vibes&display=block">
<style>
:root{--gold:#f2ad3c;--gold-hi:#ffd98e;--champ:#f7e6bf;--text:#f5efe6;--muted:#a39b8f;--bg:#050403;--wa:#25d366;
  --f-d:'Anton',Impact,sans-serif;--f-b:'Manrope',system-ui,sans-serif;--f-m:'JetBrains Mono',monospace}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#050403}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#050403;font-family:var(--f-b);color:var(--text)}
canvas.full{position:absolute;left:0;top:0;width:1920px;height:1080px}
#scenes,#scenes>.sc{position:absolute;left:0;top:0;width:1920px;height:1080px}
.sc{display:none;will-change:transform,opacity}
.a{position:absolute;left:0;top:0;transform-origin:50% 50%}
.cx{display:flex;align-items:center;justify-content:center;text-align:center}
.disp{font-family:var(--f-d);font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:.9}
.mono{font-family:var(--f-m);font-weight:700;letter-spacing:.28em;text-transform:uppercase}
.gt{background:linear-gradient(100deg,rgba(255,255,255,0) 42%,rgba(255,250,235,.95) 50%,rgba(255,255,255,0) 58%),linear-gradient(180deg,#fff4d8 0%,#ffd98e 30%,#f2ad3c 64%,#c17a1e 100%);
  background-size:320% 100%,100% 100%;background-position:150% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(242,173,60,.32))}
.st{background:linear-gradient(100deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 58%),linear-gradient(180deg,#ffffff 0%,#efe9df 55%,#a9a196 100%);
  background-size:320% 100%,100% 100%;background-position:150% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{border-radius:26px;background:linear-gradient(160deg,rgba(52,42,26,.86),rgba(16,13,9,.9));box-shadow:inset 0 0 0 1.5px rgba(255,217,142,.32),inset 0 1px 0 rgba(255,255,255,.12),0 30px 80px rgba(0,0,0,.6)}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.14em;flex:none}
.chip{display:inline-flex;align-items:center;gap:14px;padding:14px 24px;border-radius:999px;font:800 26px/1 var(--f-b);color:var(--text);
  background:linear-gradient(160deg,rgba(52,42,26,.9),rgba(16,13,9,.92));box-shadow:inset 0 0 0 1.5px rgba(255,217,142,.4),0 18px 40px rgba(0,0,0,.5);white-space:nowrap}
.chip .ic{color:var(--gold-hi);width:30px;height:30px}
.ibox{display:grid;place-items:center;border-radius:30%;color:var(--gold-hi);background:radial-gradient(circle at 30% 25%,rgba(255,217,142,.28),rgba(242,173,60,.08) 60%),rgba(20,16,10,.9);box-shadow:inset 0 0 0 1.5px rgba(255,217,142,.45),0 0 40px rgba(242,173,60,.22)}
.lbl{font:700 15px/1 var(--f-m);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-hi)}
/* avatar */
#av{position:absolute;left:0;top:0;overflow:hidden;background:#0b0907;will-change:transform}
#av img{position:absolute;left:0;top:0;display:block}
#avring{position:absolute;left:0;top:0;pointer-events:none}
/* hud */
#brand{position:absolute;left:84px;top:44px;display:flex;align-items:center;gap:14px;font:400 30px/1 var(--f-d);letter-spacing:.16em}
#brand .em{font-size:30px;letter-spacing:0}
#chap{position:absolute;right:84px;top:52px;display:flex;align-items:center;gap:16px}
#chap i{display:block;width:64px;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
#url{position:absolute;right:84px;bottom:46px;display:flex;align-items:center;gap:10px;font:700 19px/1 var(--f-m);letter-spacing:.06em;color:rgba(255,217,142,.85)}
#url .ic{width:24px;height:24px;color:#25d366}
#prog{position:absolute;left:0;top:0;height:4px;background:linear-gradient(90deg,#c17a1e,#ffd98e);box-shadow:0 0 14px rgba(242,173,60,.7)}
/* captions */
#cap{position:absolute;left:360px;right:360px;top:922px;height:80px;display:flex;align-items:center;justify-content:center}
#cap .ln{display:flex;flex-wrap:nowrap;gap:0 .28em;font:800 46px/1.1 var(--f-b);letter-spacing:-.005em;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.6),0 6px 24px rgba(0,0,0,.85)}
#cap .w{display:inline-block;transition:none}
</style></head>
<body><div id="root">
 <canvas id="bg" class="full" width="1920" height="1080"></canvas>
 <div id="scenes"></div>
 <div id="av"><img id="avimg" alt=""></div>
 <svg id="avring" width="1920" height="1080"></svg>
 <div id="over" style="position:absolute;left:0;top:0;width:1920px;height:1080px"></div>
 <canvas id="fx" class="full" width="1920" height="1080"></canvas>
 <div id="hud">
  <div id="prog"></div>
  <div id="brand"><span class="em">👑</span><span>MTG TRIBE</span></div>
  <div id="chap"><i></i><span class="lbl" id="chapt"></span></div>
  <div id="url"></div>
 </div>
 <div id="cap"></div>
</div>
<script src="timing.js"></script>
<script src="icons.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
</body></html>
