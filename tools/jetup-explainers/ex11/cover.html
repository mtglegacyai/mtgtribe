<!doctype html><html><head><meta charset="utf-8">
<!-- Cover of JetUP explainer #11, The Infinity Bonus: two strong wheels (16:9, also the poster and thumbnail on the site).
     Shoot it with shoot_cover.js: it writes the pill's length from kitcues.json and puts the video's own bicycle in #bk
     (taken from the stage at the end of Rule 1: both wheels lime, the strongest line capped at half, gear 5%). The rate
     cassette card and the infinity sign are drawn here. Never MTG's photo: the JetUP disc. No income figures.
     Needs stage/Anton-Regular.ttf and stage/jetup-disc.png; Manrope from Google Fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<style>
@font-face{font-family:'Anton';src:url(stage/Anton-Regular.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#fff;position:relative;background:
 radial-gradient(900px 650px at 74% 46%,rgba(140,108,231,.42),transparent 70%),radial-gradient(800px 600px at 8% 95%,rgba(232,194,90,.22),transparent 70%),
 radial-gradient(600px 400px at 62% 22%,rgba(203,251,97,.10),transparent 70%),linear-gradient(160deg,#150d2c,#0b0912 55%,#07050f)}
body *{font-feature-settings:"calt" 0}
.grid{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:80px 80px}
.pill{position:absolute;left:96px;top:96px;display:inline-flex;align-items:center;height:64px;padding:0 30px;border-radius:999px;background:#cbfb61;color:#14110b;font:800 28px/1 'Manrope';letter-spacing:.16em;z-index:5}
.h{position:absolute;left:92px;top:200px;font:400 150px/.95 'Anton';text-transform:uppercase;white-space:nowrap;z-index:5}
.h .g{background:linear-gradient(180deg,#fff3c4,#f3d27a 38%,#c99a2e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(232,194,90,.35))}
.sub{position:absolute;left:96px;top:520px;font:800 46px/1.25 'Manrope';color:#e9e3ff;white-space:nowrap;z-index:5}
.sub b{color:#cbfb61}
.em{font-style:normal;font-family:'Noto Color Emoji'}
.chips{position:absolute;left:96px;top:700px;display:flex;flex-direction:column;align-items:flex-start;gap:16px;z-index:5}
.chips span{display:inline-flex;align-items:center;gap:14px;height:76px;padding:0 28px;border-radius:22px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(203,251,97,.5);font:800 34px/1 'Manrope';white-space:nowrap}
.disc{position:absolute;left:1650px;top:96px;width:200px;height:200px;border-radius:50%;padding:7px;background:conic-gradient(from 210deg,#fff1b8,#c99a2e,#f7dd8d,#9c6f1f,#fff1b8);box-shadow:0 0 90px rgba(232,194,90,.45),0 30px 70px rgba(0,0,0,.55);z-index:5}
.disc img{width:100%;height:100%;border-radius:50%;display:block}
.brand{position:absolute;right:100px;bottom:80px;font:800 30px/1 'Manrope';letter-spacing:.16em;color:#e8c25a;white-space:nowrap;z-index:5}
.brand .sep{display:inline-block;width:3px;height:28px;margin:0 .5em 0 .32em;vertical-align:-4px;border-radius:2px;background:rgba(232,194,90,.75)}
#art{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:3}
/* the rate cassette card, the video's glass */
#cas{position:absolute;left:1536px;top:330px;width:324px;height:600px;border-radius:30px;z-index:4;
 background:linear-gradient(158deg,rgba(203,251,97,.13),rgba(255,255,255,.03) 34%,rgba(20,16,32,0) 70%,rgba(203,251,97,.07)),#15112a;
 box-shadow:inset 0 0 0 2.5px rgba(203,251,97,.85),0 0 34px rgba(203,251,97,.25),inset 0 0 26px rgba(203,251,97,.12),0 30px 70px rgba(0,0,0,.5)}
#cas svg{display:block;width:324px;height:600px}
</style></head><body><div class="grid"></div>

<div class="pill" id="pill">EXPLAINER · 1:59</div>
<div class="h">The <span class="g">Infinity</span><br>Bonus</div>
<div class="sub">No depth limit, <b>two strong wheels,</b><br>and the difference rule.</div>
<div class="chips"><span><i class="em">🚲</i>Two strong wheels</span><span><i class="em">♾️</i>No depth limit</span></div>
<div class="disc"><img src="stage/jetup-disc.png" alt=""></div>
<div class="brand">MTG <i class="em">👑</i><span class="sep"></span>YOUR DIGITAL ARCHITECT</div>

<svg id="art" viewBox="0 0 1920 1080"><defs>
 <linearGradient id="cInf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cbfb61"/><stop offset=".5" stop-color="#fff1bf"/><stop offset="1" stop-color="#e8c25a"/></linearGradient>
 <filter id="cGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter></defs>
 <g id="inf"></g><g id="bk"></g></svg>
<div id="cas"><svg viewBox="0 0 324 600"><defs>
 <linearGradient id="cSp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f1ff"/><stop offset=".5" stop-color="#a59ec2"/><stop offset="1" stop-color="#5e5878"/></linearGradient>
 <filter id="cG2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter></defs><g id="rows"></g></svg></div>
<script>
// the infinity sign (a lemniscate), drawn the same way as the hook's
(function () {
  const NS = 'http://www.w3.org/2000/svg', sv = (tag, at, p) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); p.appendChild(e); return e; };
  let d = ''; const X = 1210, Y = 262, A = 165;
  for (let k = 0; k <= 160; k++) { const u = Math.PI / 2 + 2 * Math.PI * k / 160, s = Math.sin(u), c = Math.cos(u), q = 1 + s * s; d += (k ? ' L ' : 'M ') + (X + A * c / q).toFixed(1) + ' ' + (Y + A * 1.05 * s * c / q).toFixed(1); }
  const g = document.getElementById('inf');
  sv('path', { d, fill: 'none', stroke: '#cbfb61', 'stroke-width': 30, opacity: .45, filter: 'url(#cGlow)' }, g);
  sv('path', { d, fill: 'none', stroke: '#14110b', 'stroke-width': 24, opacity: .6 }, g);
  sv('path', { d, fill: 'none', stroke: 'url(#cInf)', 'stroke-width': 14, 'stroke-linecap': 'round' }, g);
  // the rate cassette: nine sprockets, 1.5% (the biggest) at the bottom to 7.5% at the top; the chain on 5%
  const R = ['1.5%', '3%', '4%', '5%', '5.5%', '6%', '6.5%', '7%', '7.5%'], rows = document.getElementById('rows');
  sv('rect', { x: 98, y: 44, width: 12, height: 520, rx: 6, fill: 'url(#cSp)', opacity: .5 }, rows);
  for (let i = 0; i < 9; i++) {
    const y = 548 - i * 61, rx = 84 - i * 7.5, ry = rx * .2 + 3, on = i === 3;
    sv('ellipse', { cx: 104, cy: y + 5, rx, ry, fill: '#2a2540' }, rows);
    sv('ellipse', { cx: 104, cy: y, rx, ry, fill: 'url(#cSp)', stroke: 'rgba(255,255,255,.55)', 'stroke-width': 1.5 }, rows);
    sv('ellipse', { cx: 104, cy: y, rx: rx * .32, ry: ry * .32, fill: '#15112a' }, rows);
    if (on) { sv('ellipse', { cx: 104, cy: y, rx: rx + 12, ry: ry + 9, fill: 'none', stroke: '#cbfb61', 'stroke-width': 14, opacity: .5, filter: 'url(#cG2)' }, rows);
      sv('ellipse', { cx: 104, cy: y, rx: rx + 12, ry: ry + 9, fill: 'none', stroke: '#cbfb61', 'stroke-width': 6, 'stroke-dasharray': '9 5' }, rows); }
    const t = sv('text', { x: 210, y: y + 14, fill: on ? '#cbfb61' : '#cfc8e6', style: `font:400 ${on ? 44 : 38}px Anton;letter-spacing:.02em` }, rows); t.textContent = R[i];
  }
})();
</script>
</body></html>
