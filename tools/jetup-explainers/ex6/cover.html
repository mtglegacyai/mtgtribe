<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<style>
@font-face{font-family:'Anton';src:url(stage/Anton-Regular.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#fff;position:relative;background:
 radial-gradient(900px 650px at 78% 30%,rgba(140,108,231,.42),transparent 70%),radial-gradient(800px 600px at 8% 95%,rgba(232,194,90,.22),transparent 70%),
 linear-gradient(160deg,#150d2c,#0b0912 55%,#07050f)}
.grid{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:80px 80px}
.pill{position:absolute;left:96px;top:96px;display:inline-flex;align-items:center;height:64px;padding:0 30px;border-radius:999px;background:#cbfb61;color:#14110b;font:800 28px/1 'Manrope';letter-spacing:.16em}
.h{position:absolute;left:92px;top:205px;font:400 132px/.97 'Anton';text-transform:uppercase}
.h .g{background:linear-gradient(180deg,#fff3c4,#f3d27a 38%,#c99a2e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{position:absolute;left:96px;top:560px;font:800 50px/1.25 'Manrope';color:#e9e3ff}
.sub b{color:#cbfb61}
.chips{position:absolute;left:96px;top:760px;display:flex;gap:18px}
.chips span{display:inline-flex;align-items:center;gap:12px;height:76px;padding:0 28px;border-radius:22px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(203,251,97,.5);font:800 34px/1 'Manrope'}
.disc{position:absolute;left:1650px;top:96px;width:200px;height:200px;border-radius:50%;padding:7px;background:conic-gradient(from 210deg,#fff1b8,#c99a2e,#f7dd8d,#9c6f1f,#fff1b8);box-shadow:0 0 90px rgba(232,194,90,.45),0 30px 70px rgba(0,0,0,.55)}
.disc img{width:100%;height:100%;border-radius:50%;display:block}
.brand{position:absolute;right:100px;bottom:120px;font:800 30px/1 'Manrope';letter-spacing:.16em;color:#e8c25a}
.brand em{font-style:normal;font-family:'Noto Color Emoji'}
/* ten glass floors, three lit */
.pl{position:absolute;border-radius:24px;border:2.5px solid rgba(155,124,255,.45);background:linear-gradient(135deg,rgba(155,124,255,.14),rgba(14,10,24,.8) 50%,rgba(12,9,20,.9));box-shadow:0 0 18px rgba(155,124,255,.16);transform:rotateX(60deg) rotateZ(-45deg)}
.pl:before{content:"";position:absolute;inset:12px;border-radius:14px;border:1px solid rgba(155,124,255,.22)}
.pl.on{border:3.5px solid #cbfb61;background:linear-gradient(135deg,rgba(203,251,97,.36),rgba(203,251,97,.08) 45%,rgba(14,12,22,.62));box-shadow:0 0 40px rgba(203,251,97,.6),inset 0 0 34px rgba(203,251,97,.3)}
.pl.on:before{border:1.5px solid rgba(203,251,97,.55)}
.tag{position:absolute;left:1530px;display:flex;align-items:center;gap:12px;font:800 30px/1 'Manrope'}
.tag b{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:#cbfb61;color:#14110b}
.tag.lk b{background:rgba(20,16,34,.9);color:#cfc8e6;box-shadow:inset 0 0 0 2.5px rgba(155,124,255,.5)}
.tag em{font-style:normal;font-family:'Noto Color Emoji';font-size:34px}
</style></head><body><div class="grid"></div>
<div class="pill">EXPLAINER · 2:18</div>
<div class="h" style="top:225px">The <span class="g">partner</span><br>plan</div>
<div class="sub" style="top:520px">10 levels, but <b>only 3 open</b><br>on day one. Here's the rule 🔑</div>
<div class="chips" style="top:730px"><span>🏢 How levels open</span><span>💵 What they pay</span></div>
<div id="st"></div>
<div class="tag" style="top:330px"><em>🔒</em><span style="color:#cfc8e6">Floors 4 to 10</span></div>
<div class="tag" style="top:640px"><b>3</b><span>open with $250</span></div>
<div class="disc"><img src="stage/jetup-disc.png" alt=""></div>
<div class="brand">MTG <em>👑</em> | YOUR DIGITAL ARCHITECT</div>
<script>
const st=document.getElementById('st'), cx=1250, cy1=790, pw=270, sp=44;
for(let i=0;i<10;i++){const p=document.createElement('div');p.className='pl'+(i<3?' on':'');const cy=cy1-i*sp;
 p.style.cssText+=`left:${cx-pw/2}px;top:${cy-pw/2}px;width:${pw}px;height:${pw}px;z-index:${10+i}`;st.appendChild(p);}
</script>
</body></html>
