<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const sv = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;   // the stage's seed: the same crown

/* world coordinates: the stage's tree as it is; the gate and the basket moved in closer to it */
const TX = 700, TB = 664, CR = { x: 690, y: 320, rx: 285, ry: 172 };
const GX = 960, POSTL = [GX - 148, GX - 118], POSTR = [GX + 118, GX + 148];
const FT = 680, FB = 770;
const BK = { x: 1200, y: 772, rx: 112, ry: 25, by: 866, brx: 88 }, BKS = 1.08;   // the basket, a touch larger on the cover
const MANGO = 'M 0 -28 C 16 -29 27 -14 26 4 C 25 21 14 31 0 31 C -9 31 -14 27 -15 21 C -16 15 -12 11 -17 4 C -23 -5 -22 -19 -14 -25 C -10 -28 -5 -28 0 -28 Z';   // the stage's mango: a kidney with a beak, like the 🥭
const RIPE = [[548, 474, 1], [778, 490, 1.02], [866, 404, .96]];   // two or three mangoes, never a laden tree
const GIFT = { bx: 478, by: 600, w: 72, h: 66 };
const DROP = [BK.x + 2, BK.y - 56, .98];                            // the small mango, in the air just above the basket, dropping in
const PATHD = 'M 902 682 C 922 688 936 700 946 716 C 958 734 963 752 964 770 C 967 806 1012 828 1062 826 C 1100 824 1124 806 1138 790';   // from inside the open gate (clear of the left leaf) to the basket, never out of the trunk (your own money stays in)
/* the camera: world point (wx, wy) at screen (sx, sy), scale k */
const CAM = { k: .9, wx: 850, wy: 505, sx: 1420, sy: 550 };
const toW = x => CAM.wx + (x - CAM.sx) / CAM.k;
$('world').style.transform = `translate(${(CAM.sx - CAM.wx * CAM.k).toFixed(2)}px,${(CAM.sy - CAM.wy * CAM.k).toFixed(2)}px) scale(${CAM.k})`;
// side fade (screen x, a smooth ramp): in from 975 to 1240 on the left, out from 1820 to 1915 on the right
const [L0, L1, R0, R1] = [975, 1240, 1820, 1915].map(toW), sd = $('gSide');
sd.setAttribute('x1', L0); sd.setAttribute('x2', R1);
const ramp = [[0, 0], [.2, .1], [.4, .32], [.6, .62], [.8, .87], [1, 1]];
[...ramp.map(([u, o]) => [(L0 + u * (L1 - L0) - L0) / (R1 - L0), o]), ...ramp.map(([u, o]) => [(R1 - u * (R1 - R0) - L0) / (R1 - L0), o]).reverse()]
  .forEach(([off, o]) => sv('stop', { offset: off.toFixed(4), 'stop-color': '#fff', 'stop-opacity': o }, sd));

const G = { ground: $('wGround'), tree: $('wTree'), fence: $('wFence'), front: $('wFront') };

/* ground: the lawn of your backyard behind the fence, the ground outside it (the stage's, verbatim: it also keeps the seed) */
const lawn = sv('g', {}, G.ground);
sv('rect', { x: -3000, y: 500, width: 8000, height: 280, fill: 'url(#gLawn)' }, lawn);
sv('ellipse', { cx: 760, cy: 640, rx: 620, ry: 70, fill: 'url(#gYard)' }, lawn);
for (let i = 0; i < 70; i++) {
  const x = -300 + rnd() * 2500, y = 600 + rnd() * 80, h = 6 + rnd() * 9;
  sv('path', { d: `M${x} ${y} l -3 ${-h} M${x + 3} ${y} l 2 ${-h * 1.2} M${x + 6} ${y} l 5 ${-h * .8}`, stroke: rnd() < .5 ? '#2f6e33' : '#3f8a3c', 'stroke-width': 2, 'stroke-linecap': 'round', opacity: .55 }, lawn);
}
const outside = sv('g', {}, G.ground);
sv('rect', { x: -3000, y: FB - 2, width: 8000, height: 330, fill: 'url(#gGround)' }, outside);   // fades out before the bottom edge
sv('ellipse', { cx: GX + 60, cy: FB + 46, rx: 360, ry: 80, fill: 'url(#gGlowVio)', opacity: .55 }, outside);
sv('rect', { x: -3000, y: FB - 2, width: 8000, height: 3, fill: '#cbfb61', opacity: .12 }, outside);
for (let i = 0; i < 90; i++) {
  const x = -300 + i * 30 + rnd() * 14, y = FB + 4 + rnd() * 6, h = 7 + rnd() * 9;
  sv('path', { d: `M${x} ${y} l -3 ${-h} M${x + 3} ${y} l 2 ${-h * 1.2} M${x + 6} ${y} l 5 ${-h * .8}`, stroke: rnd() < .5 ? '#2c5e33' : '#3a7a3b', 'stroke-width': 2.2, 'stroke-linecap': 'round', opacity: .7 }, outside);
}
[[978, 796, 40, 11], [1036, 820, 44, 12]].forEach(([x, y, rx, ry]) => {   // stepping stones from the gate towards the basket
  sv('ellipse', { cx: x + 3, cy: y + 4, rx, ry, fill: '#000', opacity: .35 }, outside);
  sv('ellipse', { cx: x, cy: y, rx, ry, fill: '#3b3355' }, outside);
  sv('ellipse', { cx: x - 6, cy: y - 3, rx: rx * .7, ry: ry * .5, fill: '#5a5178', opacity: .55 }, outside);
});

/* the tree: trunk (your own money), the gift branch, the crown, the ripe mangoes */
const treeG = sv('g', {}, G.tree);
const TRUNK = 'M 652 668 C 672 650 676 612 676 572 C 676 536 670 502 660 474 C 640 444 600 410 552 372 L 566 360 C 606 392 646 418 680 444 ' +
  'C 684 404 690 362 694 300 L 712 300 C 716 362 718 404 722 444 C 756 414 800 384 846 352 L 858 366 C 816 398 772 436 744 476 ' +
  'C 734 514 728 548 728 584 C 728 620 738 650 760 668 Z';
sv('ellipse', { cx: TX + 4, cy: TB + 2, rx: 92, ry: 12, fill: '#000', opacity: .35, filter: 'url(#fBlur3)' }, treeG);
sv('path', { d: TRUNK, fill: 'url(#gTrunk)' }, treeG);
[['M 668 650 C 676 610 674 560 666 520', .35], ['M 702 656 C 708 610 706 560 700 500', .3], ['M 716 640 C 722 600 722 556 716 520', .25],
 ['M 690 600 C 694 580 694 560 690 540', .3]].forEach(([d, o]) => sv('path', { d, fill: 'none', stroke: '#2a180c', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: o }, treeG));
sv('path', { d: 'M 726 660 C 722 620 724 560 734 500', fill: 'none', stroke: '#ffd98a', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: .35 }, treeG);

// the gift branch (the promo), with its gift box hanging from the tip
const giftG = sv('g', {}, treeG);
sv('path', { d: 'M 676 520 C 620 532 552 548 478 584', fill: 'none', stroke: 'url(#gBranch)', 'stroke-width': 15, 'stroke-linecap': 'round' }, giftG);
[[600, 538, -150], [560, 548, -30], [526, 560, -160], [500, 574, -20], [640, 528, -40]].forEach(([x, y, r]) =>
  sv('ellipse', { cx: x, cy: y, rx: 24, ry: 8, fill: '#2f7d34', transform: `rotate(${r} ${x} ${y})` }, giftG));
sv('line', { x1: 480, y1: 584, x2: 478, y2: 600, stroke: '#e8c25a', 'stroke-width': 2.5 }, giftG);
const giftBox = sv('g', { transform: `rotate(-4 ${GIFT.bx} ${GIFT.by})` }, giftG);
sv('rect', { x: GIFT.bx - GIFT.w / 2, y: GIFT.by, width: GIFT.w, height: GIFT.h, rx: 8, fill: 'url(#gGift)', filter: 'url(#fSoft)' }, giftBox);
sv('rect', { x: GIFT.bx - GIFT.w / 2 - 4, y: GIFT.by, width: GIFT.w + 8, height: 18, rx: 5, fill: '#b9a3ff' }, giftBox);
sv('rect', { x: GIFT.bx - 7, y: GIFT.by, width: 14, height: GIFT.h, fill: 'url(#gRibbon)' }, giftBox);
sv('rect', { x: GIFT.bx - GIFT.w / 2 - 4, y: GIFT.by + 7, width: GIFT.w + 8, height: 10, fill: 'url(#gRibbon)' }, giftBox);
sv('path', { d: `M ${GIFT.bx} ${GIFT.by + 2} C ${GIFT.bx - 30} ${GIFT.by - 22} ${GIFT.bx - 34} ${GIFT.by + 8} ${GIFT.bx} ${GIFT.by + 2} M ${GIFT.bx} ${GIFT.by + 2} C ${GIFT.bx + 30} ${GIFT.by - 22} ${GIFT.bx + 34} ${GIFT.by + 8} ${GIFT.bx} ${GIFT.by + 2}`, fill: '#d8ff7a', stroke: '#8fcf2a', 'stroke-width': 2 }, giftBox);

// the crown: back masses, mid masses, light masses, then mango leaves (procedural, seeded as on the stage)
const crownG = sv('g', {}, treeG);
const blobs = [];
for (let i = 0; i < 11; i++) {
  const a = Math.PI * (1.0 + i / 10);
  blobs.push([CR.x + .7 * CR.rx * Math.cos(a), CR.y + .55 * CR.ry * Math.sin(a), 74 + 12 * rnd(), 'url(#gBlobD)']);
}
[[-205, 62, 80], [-110, 104, 86], [0, 112, 88], [110, 104, 86], [205, 58, 78]].forEach(([x, y, r]) => blobs.push([CR.x + x, CR.y + y, r, 'url(#gBlobD)']));
[[-120, -6, 112], [0, -36, 118], [124, 0, 110], [0, 46, 118], [-86, 50, 96], [96, 56, 98]].forEach(([x, y, r]) => blobs.push([CR.x + x, CR.y + y, r, 'url(#gBlobM)']));
[[-120, -78, 76], [-20, -98, 74], [92, -86, 72], [-196, -26, 64], [-64, -40, 70], [176, -36, 62]].forEach(([x, y, r]) => blobs.push([CR.x + x, CR.y + y, r, 'url(#gBlobL)']));
blobs.forEach(([x, y, r, f]) => sv('circle', { cx: x, cy: y, r, fill: f }, crownG));
const leafG = sv('g', {}, crownG);
for (let i = 0; i < 260; i++) {
  const a = rnd() * Math.PI * 2, rf = .62 + .44 * Math.sqrt(rnd());
  const x = CR.x + CR.rx * rf * Math.cos(a), y = CR.y + CR.ry * rf * Math.sin(a) * (Math.sin(a) > 0 ? .86 : 1);
  if (y > CR.y + CR.ry - 2 || y < CR.y - CR.ry + 6) continue;
  const top = clamp((CR.y + CR.ry - y) / (2 * CR.ry)), lit = rnd() < .06 * top;
  const col = lit ? '#8fca52' : ['#14421f', '#1b5427', '#24692f', '#317d38', '#42953f'][Math.min(4, Math.floor(top * 3.6 + rnd() * 1.4))];
  const rot = a * 180 / Math.PI + 90 + (rnd() - .5) * 70;
  sv('ellipse', { cx: x, cy: y, rx: 23 + rnd() * 9, ry: 6.5 + rnd() * 2, fill: col, opacity: .92, transform: `rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})` }, leafG);
}
sv('ellipse', { cx: CR.x, cy: CR.y + 150, rx: 260, ry: 60, fill: '#06140a', opacity: .28, filter: 'url(#fBlur)' }, crownG);

// the lime ribbon, tied where the gift branch meets the trunk (drawn over the crown's edge, so it reads)
const ribbon = sv('g', {}, treeG);
sv('ellipse', { cx: 668, cy: 528, rx: 74, ry: 58, fill: 'url(#gGlowLime)', opacity: .75 }, ribbon);
sv('path', { d: 'M 652 520 l 32 -5 l 2 13 l -32 6 Z', fill: 'url(#gRibbon)' }, ribbon);
sv('path', { d: 'M 666 524 C 634 494 616 510 632 528 C 643 540 658 534 666 524 Z M 666 524 C 698 492 718 508 702 528 C 690 540 676 534 666 524 Z', fill: '#d8ff7a', stroke: '#8fcf2a', 'stroke-width': 2.2 }, ribbon);

// the mangoes (ripe, each with a warm glow): your profit, when the strategy makes one
function mango(parent, x, y, k, rot = 0, withStalk = true, leaf = false, glow = .55) {

  if (withStalk) sv('path', { d: 'M 1 -26 C 2 -36 -1 -44 -6 -52', fill: 'none', stroke: '#5a3a22', 'stroke-width': 3.5, 'stroke-linecap': 'round' }, g);
  if (withStalk) sv('path', { d: 'M 2 -28 C 7 -38 18 -42 28 -38 C 21 -31 11 -27 2 -28 Z', fill: 'url(#gLeafG)' }, g);   // one leaf, as on the stage
  sv('path', { d: MANGO, fill: 'url(#gRipe)' }, g);
  sv('path', { d: MANGO, fill: 'url(#gBlush)', opacity: .8 }, g);
  sv('path', { d: MANGO, fill: 'url(#gHi)' }, g);
  sv('ellipse', { cx: -7, cy: -11, rx: 4.5, ry: 8, fill: '#fff', opacity: .38, transform: 'rotate(18 -7 -11)' }, g);
  if (leaf) {
    sv('path', { d: 'M 0 -26 C 0 -31 1 -34 3 -36', fill: 'none', stroke: '#5a3a22', 'stroke-width': 3.5, 'stroke-linecap': 'round' }, g);
    sv('path', { d: 'M 2 -34 C 12 -48 32 -50 40 -42 C 30 -32 14 -30 2 -34 Z', fill: 'url(#gLeafG)' }, g);
    sv('path', { d: 'M 4 -35 C 16 -40 28 -42 38 -42', fill: 'none', stroke: '#1d5a26', 'stroke-width': 1.5, opacity: .7 }, g);
  }
  return g;
}

/* the fence: pickets, rails, the gate's posts and beam (the gate's sign is left off the cover: no small words) */

}
[[FT + 26, 9], [FB - 26, 9]].forEach(([y, h]) => {

const gateG = sv('g', {}, G.fence);

sv('rect', { x: GX - 168, y: 548, width: 336, height: 14, rx: 4, fill: 'url(#gPost)' }, gateG);
sv('rect', { x: GX - 168, y: 548, width: 336, height: 3, fill: '#ffd98a', opacity: .5 }, gateG);

/* the gate leaves (HTML, swung open in 3D, as on the stage) */
function leafSVG(mirror) {
  let s = `<svg viewBox="0 0 118 130"${mirror ? ' style="transform:scaleX(-1)"' : ''}><defs><linearGradient id="gB${mirror ? 'r' : 'l'}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0a271"/><stop offset=".18" stop-color="#a87648"/><stop offset="1" stop-color="#5e3d25"/></linearGradient></defs>`;
  for (let i = 0; i < 5; i++) {
    const x0 = i * 23.6, x1 = x0 + 21.6, y0 = 18 * Math.pow(x0 / 118, 1.6), y1 = 18 * Math.pow(x1 / 118, 1.6);
    s += `<path d="M${x0} ${y0 + 4} Q${x0 + 10.8} ${y0 - 3} ${x1} ${y1 + 2} L${x1} 130 L${x0} 130 Z" fill="url(#gB${mirror ? 'r' : 'l'})"/>`;
    s += `<rect x="${x0 + 2}" y="${y0 + 8}" width="2" height="${118 - y0}" fill="#fff" opacity=".12"/>`;
  }
  s += '<rect x="0" y="32" width="118" height="11" fill="#4d311d"/><rect x="0" y="100" width="118" height="11" fill="#4d311d"/>';
  s += '<path d="M8 100 L110 43 L110 56 L22 104 Z" fill="#5a3a22"/>';
  s += '<rect x="-4" y="33" width="44" height="9" rx="3" fill="#e8c25a"/><rect x="-4" y="101" width="44" height="9" rx="3" fill="#e8c25a"/>';
  s += '<circle cx="2" cy="37.5" r="4" fill="#fff1bf"/><circle cx="2" cy="105.5" r="4" fill="#fff1bf"/>';
  s += '<rect x="100" y="64" width="18" height="10" rx="3" fill="#e8c25a"/><circle cx="104" cy="69" r="2.5" fill="#7a5520"/>';
  return s + '</svg>';
}

const basketG = sv('g', { transform: `translate(${BK.x} ${BK.by}) scale(${BKS}) translate(${-BK.x} ${-BK.by})` }, G.front);
sv('ellipse', { cx: BK.x + 6, cy: BK.by + 6, rx: 128, ry: 15, fill: '#000', opacity: .5, filter: 'url(#fBlur3)' }, basketG);
sv('path', { d: `M ${BK.x - 98} ${BK.y} C ${BK.x - 96} ${BK.y - 112} ${BK.x + 96} ${BK.y - 112} ${BK.x + 98} ${BK.y}`, fill: 'none', stroke: '#9a6a30', 'stroke-width': 13, 'stroke-linecap': 'round' }, basketG);
sv('path', { d: `M ${BK.x - 98} ${BK.y} C ${BK.x - 96} ${BK.y - 112} ${BK.x + 96} ${BK.y - 112} ${BK.x + 98} ${BK.y}`, fill: 'none', stroke: '#f3cf86', 'stroke-width': 5, 'stroke-dasharray': '9 7', 'stroke-linecap': 'round', opacity: .8 }, basketG);

sv('ellipse', { cx: BK.x, cy: BK.y - 4, rx: 80, ry: 18, fill: 'url(#gGlowGold)', opacity: .7 }, basketG);   // the warm light of the fruit coming in
// the small mango, dropping in: its shadow waits inside the basket, two short streaks above it show the drop
sv('ellipse', { cx: DROP[0] - 2, cy: BK.y + 2, rx: 30, ry: 8, fill: '#000', opacity: .55, filter: 'url(#fBlur3)' }, basketG);

sv('stop', { offset: 0, 'stop-color': '#fff1bf', 'stop-opacity': .9 }, streak); sv('stop', { offset: 1, 'stop-color': '#fff1bf', 'stop-opacity': 0 }, streak);
[[-15, 0], [15, 8]].forEach(([dx, dy]) => sv('rect', { x: DROP[0] + dx - 3, y: DROP[1] - 78 + dy, width: 6, height: 38, rx: 3, fill: 'url(#gStreak)', transform: `rotate(-8 ${DROP[0]} ${DROP[1]})` }, basketG));
sv('circle', { cx: DROP[0], cy: DROP[1], r: 82, fill: 'url(#gGlowGold)', opacity: .8 }, basketG);
mango(basketG, DROP[0], DROP[1], DROP[2], 10, false, true, .95);
const bodyD = `M ${BK.x - BK.rx} ${BK.y} C ${BK.x - BK.rx + 2} ${BK.y + 50} ${BK.x - BK.brx - 4} ${BK.by - 10} ${BK.x - BK.brx} ${BK.by} ` +
  `C ${BK.x - 40} ${BK.by + 12} ${BK.x + 40} ${BK.by + 12} ${BK.x + BK.brx} ${BK.by} C ${BK.x + BK.brx + 4} ${BK.by - 10} ${BK.x + BK.rx - 2} ${BK.y + 50} ${BK.x + BK.rx} ${BK.y} ` +
  `A ${BK.rx} ${BK.ry} 0 0 1 ${BK.x - BK.rx} ${BK.y} Z`;
sv('path', { d: bodyD, fill: 'url(#gStraw)' }, basketG);
const cb = sv('clipPath', { id: 'cBasket' }, $('wback').querySelector('defs'));
sv('path', { d: bodyD }, cb);
const weave = sv('g', { 'clip-path': 'url(#cBasket)' }, basketG);
for (let r = 0; r < 6; r++) {
  const y = BK.y + 14 + r * 15, w = BK.rx - (BK.rx - BK.brx) * (r / 6), sag = 22 - r * 2;
  sv('path', { d: `M ${BK.x - w - 10} ${y} Q ${BK.x} ${y + sag} ${BK.x + w + 10} ${y}`, fill: 'none', stroke: r % 2 ? '#b77a35' : '#e2b064', 'stroke-width': 11 }, weave);

}
sv('path', { d: bodyD, fill: 'url(#gStrawS)' }, basketG);
sv('path', { d: `M ${BK.x - BK.rx} ${BK.y} A ${BK.rx} ${BK.ry} 0 0 0 ${BK.x + BK.rx} ${BK.y}`, fill: 'none', stroke: '#f6d48e', 'stroke-width': 10, 'stroke-linecap': 'round' }, basketG);
sv('path', { d: `M ${BK.x - BK.rx} ${BK.y} A ${BK.rx} ${BK.ry} 0 0 0 ${BK.x + BK.rx} ${BK.y}`, fill: 'none', stroke: '#a8702e', 'stroke-width': 4, 'stroke-dasharray': '7 6' }, basketG);
