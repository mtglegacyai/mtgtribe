const toS = (c, x, y) => [c.sx + (x - c.wx) * c.k, c.sy + (y - c.wy) * c.k];

/* ---------- the hall (back camera): wall, one tall window, one brass pendant lamp, wainscot, wooden floor ---------- */

  sv('rect', { x: x - w / 2, y: 120, width: w, height: 8, fill: '#2a1a12' }, hall);
