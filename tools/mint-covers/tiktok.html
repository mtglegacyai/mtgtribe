<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=block" rel="stylesheet">
<style>@font-face{font-family:'Anton';src:url(Anton-Regular.ttf)}*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;font-family:Manrope,sans-serif;color:#fff;background:radial-gradient(900px 700px at 50% 62%,rgba(64,228,168,.22),transparent 70%),linear-gradient(180deg,#062a27,#041716 50%,#020c0b)}
.bot{position:absolute;left:0;top:560px;width:1080px;height:auto;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 80%,transparent 100%)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,17,16,0) 60%,rgba(3,17,16,.6) 76%,rgba(3,17,16,.92) 90%)}
.c{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.pill{display:inline-flex;align-items:center;gap:.5em;height:2.25em;padding:0 1.05em;border-radius:999px;font-size:38px;font-weight:800;letter-spacing:.12em;background:#ff3b5c;color:#fff;box-shadow:0 0 50px rgba(255,59,92,.55),0 10px 30px rgba(0,0,0,.35)}
.pill i{width:.55em;height:.55em;border-radius:50%;background:#fff}
.h{font-family:Anton;line-height:.92;text-transform:uppercase;white-space:nowrap;filter:drop-shadow(0 10px 30px rgba(0,0,0,.85))}
.k{color:#cbfb61;filter:drop-shadow(0 0 34px rgba(203,251,97,.55))}
.g{background:linear-gradient(180deg,#fffbe6,#ffe08f 45%,#e9ad2f);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:.55em;font-size:40px}
.chip{display:flex;align-items:center;gap:.45em;height:2.3em;padding:0 .8em 0 .35em;border-radius:.6em;background:#fff;color:#0a2422;font-weight:800;letter-spacing:.03em;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.chip .ic{width:1.7em;height:1.7em;border-radius:.45em;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#1d5a55,#0b2b29 75%)}
.chip .ic i{font-style:normal;font-family:'Noto Color Emoji';font-size:1.05em;line-height:1}
.addr{display:inline-flex;align-items:center;height:2.1em;padding:0 1em;border-radius:999px;background:#cbfb61;color:#0a2422;font-size:44px;font-weight:800;box-shadow:0 0 40px rgba(203,251,97,.5),0 12px 28px rgba(0,0,0,.4)}
.disc{position:absolute;left:60px;top:80px;width:150px;height:150px;border-radius:50%;padding:6px;background:conic-gradient(from 210deg,#fff1b8,#c99a2e,#f7dd8d,#9c6f1f,#fff1b8);box-shadow:0 0 50px rgba(232,194,90,.5),0 20px 50px rgba(0,0,0,.6)}
.disc img{width:100%;height:100%;border-radius:50%;display:block}
</style></head><body><img class="bot" src="bolt-sq.jpg"><div class="shade"></div>
<div class="disc"><img src="mtg-disc.png"></div>
<div class="c" style="top:270px"><div class="pill"><i></i>OFFICIAL TRAILER</div></div>
<div class="c" style="top:380px"><div class="h k" style="font-size:236px">MoveMint</div></div>
<div class="c" style="top:600px"><div class="h" style="font-size:170px">in 49 <span class="g">seconds</span></div></div>
<div class="c" style="top:1400px"><div class="chips"><span class="chip"><span class="ic"><i>📈</i></span>STOCKS</span><span class="chip"><span class="ic"><i>🥇</i></span>GOLD</span><span class="chip"><span class="ic"><i>🏦</i></span>TREASURIES</span></div></div>
<div class="c" style="top:1548px"><div class="addr">mtgtribe.com/mint</div></div>
</body></html>
