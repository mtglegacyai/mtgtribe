<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=block" rel="stylesheet">
<style>@font-face{font-family:'Anton';src:url(Anton-Regular.ttf)}*{box-sizing:border-box;margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden}
body{position:relative;font-family:Manrope,sans-serif;color:#fff;background:#041716 url(bolt34.jpg) no-repeat;background-size:2100px 1181px;background-position:-30px -50px}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,17,16,.97) 0%,rgba(3,17,16,.9) 34%,rgba(3,17,16,.55) 52%,rgba(3,17,16,0) 68%),linear-gradient(0deg,rgba(3,17,16,.55),transparent 30%)}
.glow{position:absolute;left:-200px;top:-150px;width:1100px;height:900px;background:radial-gradient(closest-side,rgba(64,228,168,.22),transparent)}
.pill{position:absolute;left:84px;top:90px;display:inline-flex;align-items:center;gap:.5em;height:2.25em;padding:0 1.05em;border-radius:999px;font-size:40px;font-weight:800;letter-spacing:.12em;background:#ff3b5c;color:#fff;box-shadow:0 0 50px rgba(255,59,92,.55),0 10px 30px rgba(0,0,0,.35)}
.pill i{width:.55em;height:.55em;border-radius:50%;background:#fff}
.h{position:absolute;font-family:Anton;line-height:.92;text-transform:uppercase;white-space:nowrap;filter:drop-shadow(0 10px 30px rgba(0,0,0,.8))}
.k{color:#cbfb61;filter:drop-shadow(0 0 34px rgba(203,251,97,.5))}
.g{background:linear-gradient(180deg,#fffbe6,#ffe08f 45%,#e9ad2f);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{position:absolute;left:84px;top:800px;display:flex;gap:.6em;font-size:42px}
.chip{display:flex;align-items:center;gap:.45em;height:2.3em;padding:0 .8em 0 .35em;border-radius:.6em;background:#fff;color:#0a2422;font-weight:800;letter-spacing:.03em;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.chip .ic{width:1.7em;height:1.7em;border-radius:.45em;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#1d5a55,#0b2b29 75%)}
.chip .ic i{font-style:normal;font-family:'Noto Color Emoji';font-size:1.05em;line-height:1}
.disc{position:absolute;right:56px;top:56px;width:170px;height:170px;border-radius:50%;padding:7px;background:conic-gradient(from 210deg,#fff1b8,#c99a2e,#f7dd8d,#9c6f1f,#fff1b8);box-shadow:0 0 50px rgba(232,194,90,.5),0 20px 50px rgba(0,0,0,.6)}
.disc img{width:100%;height:100%;border-radius:50%;display:block}
.dur{position:absolute;right:56px;bottom:52px;padding:.3em .7em;border-radius:.45em;background:rgba(0,0,0,.78);font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
</style></head><body><div class="shade"></div><div class="glow"></div>
<div class="pill"><i></i>OFFICIAL TRAILER</div>
<div class="h" style="left:76px;top:210px;font-size:250px"><span class="k">MoveMint</span></div>
<div class="h" style="left:80px;top:455px;font-size:200px">in 49</div>
<div class="h" style="left:80px;top:640px;font-size:132px"><span class="g">seconds</span></div>
<div class="chips"><span class="chip"><span class="ic"><i>📈</i></span>STOCKS</span><span class="chip"><span class="ic"><i>🥇</i></span>GOLD</span><span class="chip"><span class="ic"><i>🏦</i></span>TREASURIES</span></div>
<div class="disc"><img src="mtg-disc.png"></div></body></html>
