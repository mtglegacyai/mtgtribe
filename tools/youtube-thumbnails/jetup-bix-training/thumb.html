<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<style>
@font-face{font-family:'Anton';src:url(../Anton-Regular.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#fff;position:relative;background:radial-gradient(900px 700px at 78% 45%,rgba(203,251,97,.20),transparent 70%),radial-gradient(800px 600px at 6% 96%,rgba(140,108,231,.35),transparent 70%),linear-gradient(160deg,#150d2c,#0b0912 55%,#07050f)}
.card{position:absolute;left:1000px;top:90px;width:1060px;height:940px;background:url(card.jpg) center/cover;-webkit-mask-image:radial-gradient(farthest-side at 52% 52%,#000 62%,transparent 100%);mask-image:radial-gradient(farthest-side at 52% 52%,#000 62%,transparent 100%)}
.pill{position:absolute;left:80px;top:70px;display:inline-flex;align-items:center;gap:16px;height:76px;padding:0 34px;border-radius:999px;background:#ff3b5c;color:#fff;font:800 34px/1 'Manrope';letter-spacing:.12em;box-shadow:0 0 50px rgba(255,59,92,.45)}
.pill i{width:18px;height:18px;border-radius:50%;background:#fff;display:inline-block}
.h{position:absolute;left:70px;top:168px;font:400 236px/.9 'Anton';text-transform:uppercase;white-space:nowrap;letter-spacing:.005em;filter:drop-shadow(0 10px 40px rgba(0,0,0,.8))}
.h .p{color:#cbfb61}
.h .l{color:#cbfb61;filter:drop-shadow(0 0 40px rgba(203,251,97,.45))}
.sub{position:absolute;left:80px;top:850px;font:800 58px/1.2 'Manrope';white-space:nowrap;text-shadow:0 4px 24px rgba(0,0,0,.85)}
.sub b{color:#cbfb61}
.flow{position:absolute;left:82px;top:720px;display:flex;align-items:center;gap:18px}
.flow span{display:inline-flex;align-items:center;height:84px;padding:0 30px;border-radius:24px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 3px rgba(203,251,97,.55);font:800 40px/1 'Manrope';white-space:nowrap}
.flow em{font-style:normal;font:800 54px/1 'Manrope';color:#cbfb61}
.disc{position:absolute;left:1650px;top:70px;width:200px;height:200px;border-radius:50%;padding:7px;background:conic-gradient(from 210deg,#fff1b8,#c99a2e,#f7dd8d,#9c6f1f,#fff1b8);box-shadow:0 0 90px rgba(232,194,90,.45),0 30px 70px rgba(0,0,0,.55)}
.disc img{width:100%;height:100%;border-radius:50%;display:block}
.brand{display:none}
.brand .sep{display:inline-block;width:3px;height:28px;margin:0 .5em 0 .32em;vertical-align:-4px;border-radius:2px;background:rgba(232,194,90,.75)}
.em{font-style:normal;font-family:'Noto Color Emoji'}
</style></head><body>
<div class="card"></div>
<div class="pill"><i></i>LIVE ON A PHONE</div>
<div class="h">JetUP<br><span class="p">+</span> BIX <span class="p">+</span> TAG<br><span class="l">Training</span></div>
<div class="sub">Crypto to <b>Visa card</b>, every tap</div>
<div class="disc"><img src="../jetup-disc.png" alt=""></div>
<div class="brand">MTG <i class="em">👑</i><span class="sep"></span>YOUR DIGITAL ARCHITECT</div>
</body></html>
