.tc .ic{width:92px;height:92px;border-radius:24px;display:grid;place-items:center;font-size:52px;flex:none}

.tc .ok{margin-left:auto;font:800 30px/1 'Manrope';padding:14px 18px;border-radius:16px}

.t1 .ic{background:linear-gradient(160deg,#8c6ce7,#4a2c9e)}

.t2{top:470px;left:1100px;width:680px;transform:rotate(2deg);box-shadow:0 0 0 6px #cbfb61,0 0 70px rgba(203,251,97,.55),0 30px 70px rgba(0,0,0,.55)}
.t2 .ic{background:linear-gradient(160deg,#dcff86,#9fd630)}
.t2 .ok{background:#cbfb61;color:#14190a;font-size:46px;padding:12px 20px}
.arrow{position:absolute;left:1300px;top:318px;display:flex;align-items:center;gap:18px;font:800 32px/1 'Manrope';letter-spacing:.12em;color:#cbfb61;text-transform:uppercase;text-shadow:0 2px 20px rgba(0,0,0,.8)}
.arrow svg{width:96px;height:140px;filter:drop-shadow(0 0 18px rgba(203,251,97,.6))}
.disc{position:absolute;left:1712px;top:60px;width:160px;height:160px;border-radius:50%;padding:6px;background:conic-gradient(from 210deg,#fff1b8,#c99a2e,#f7dd8d,#9c6f1f,#fff1b8);box-shadow:0 0 70px rgba(232,194,90,.45),0 24px 60px rgba(0,0,0,.55)}
.disc img{width:100%;height:100%;border-radius:50%;display:block}
.bar{position:absolute;left:1150px;top:670px;width:620px;height:288px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.6)) drop-shadow(0 0 60px rgba(255,190,60,.45))}
.em{font-style:normal;font-family:'Noto Color Emoji'}
